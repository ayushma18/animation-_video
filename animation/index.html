<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Place Value Pals — Storybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* ============ PALETTE (change per variant) ============ */
:root{
  --world:"storybook";
  --font:"Fredoka";
  --one:#FF8A3D; --one-d:#E86A18;
  --ten:#2F6BFF; --ten-d:#1B4ED6;
  --ink:#1B2B4D; --char-stroke:#1B2B4D;
  --good:#43C06A; --accent:#FFC83D;
  --stage-bg:linear-gradient(#BFE3FF,#EAF6FF);
  --caption-bg:rgba(27,43,77,.92); --caption-fg:#fff;
  --unit-bg:linear-gradient(145deg,#FFB36B,var(--one));
  --rod-bg:linear-gradient(145deg,#6E9BFF,var(--ten));
  --rod-seg:rgba(27,43,77,.45);
  --card-bg:#ffffff; --card-br:var(--ten);
  --glow:rgba(255,200,61,.95);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; background:#10131a; font-family:var(--font),"Baloo 2",system-ui,sans-serif; overflow:hidden;}
#app{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
#stageWrap{position:relative;}
#stage{position:relative; width:1920px; height:1080px; transform-origin:top left;
  background:var(--stage-bg); overflow:hidden; border-radius:18px; box-shadow:0 20px 80px rgba(0,0,0,.5);}
.layer{position:absolute; inset:0;}
#bg .cloud{position:absolute; background:#fff; border-radius:50%; opacity:.9;}
#bg .hill{position:absolute; left:-5%; width:110%; border-radius:50% 50% 0 0;}
#bg .star{position:absolute; background:#fff; border-radius:50%;}
.sign{position:absolute; background:#B5793B; color:#fff; padding:14px 26px; border-radius:14px;
  font-weight:700; font-size:34px; border:6px solid #8a5a28; box-shadow:0 8px 0 rgba(0,0,0,.15);}
.sign:before{content:""; position:absolute; width:12px; height:40px; background:#8a5a28; left:50%; bottom:-40px; transform:translateX(-50%);}
#scene{z-index:5;}
.obj{position:absolute; will-change:transform,opacity;}
.bigtext{position:absolute; color:var(--ink); font-weight:800; text-align:center; line-height:1.05;
  font-family:"Baloo 2",var(--font),sans-serif; left:50%; transform:translateX(-50%);}
.label{position:absolute; font-weight:800; color:#fff; background:var(--ten); padding:8px 28px; border-radius:40px;
  font-size:46px; border:5px solid rgba(255,255,255,.85); box-shadow:0 8px 0 rgba(0,0,0,.12);}
.label.ones{background:var(--one);}
.pill{position:absolute; background:var(--card-bg); color:var(--ink); border:5px solid var(--card-br);
  border-radius:26px; padding:12px 30px; font-weight:800; box-shadow:0 10px 0 rgba(0,0,0,.08);}
.unit{position:absolute; border-radius:12px; background:var(--unit-bg); border:4px solid var(--one-d);
  box-shadow:inset 0 6px 10px rgba(255,255,255,.45), inset 0 -6px 10px rgba(0,0,0,.12);}
.rod{position:absolute; border-radius:12px; overflow:hidden; background:var(--rod-bg); border:4px solid var(--ten-d);
  box-shadow:inset 0 6px 10px rgba(255,255,255,.4), inset 0 -6px 10px rgba(0,0,0,.14);}
.rod .seg{position:absolute; left:0; right:0; border-top:3px solid var(--rod-seg);}
.counter{position:absolute; font-weight:800; color:var(--ink); font-family:"Baloo 2",var(--font),sans-serif;}
.chart{position:absolute; background:var(--card-bg); border:7px solid var(--ink); border-radius:24px; overflow:hidden; box-shadow:0 14px 0 rgba(0,0,0,.1);}
.chart .divider{position:absolute; top:0; bottom:0; width:6px; background:var(--ink);}
.chart .col-h{position:absolute; top:0; height:92px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:46px; color:#fff;}
#caption{position:absolute; left:50%; bottom:46px; transform:translateX(-50%); max-width:1500px;
  background:var(--caption-bg); color:var(--caption-fg); font-size:44px; font-weight:600; padding:16px 40px;
  border-radius:24px; text-align:center; z-index:30; opacity:0; transition:opacity .15s; font-family:var(--font),sans-serif;}
#titleWrap{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; pointer-events:none;}
#titleWrap h1{font-family:"Baloo 2",var(--font),sans-serif; font-size:120px; color:var(--ten); -webkit-text-stroke:8px #fff; paint-order:stroke; text-shadow:0 10px 0 rgba(27,43,77,.18);}
#titleWrap h2{font-family:"Baloo 2",var(--font),sans-serif; font-size:66px; color:var(--one); -webkit-text-stroke:6px #fff; paint-order:stroke; margin-top:10px;}
#wipe{position:absolute; inset:0; background:var(--ten); z-index:40; transform:translateX(-110%); pointer-events:none;}
#wipe.go{animation:wipe .45s ease-in-out;}
@keyframes wipe{0%{transform:translateX(-110%)}50%{transform:translateX(0)}100%{transform:translateX(110%)}}
.confetti{position:absolute; width:18px; height:26px; top:-30px; z-index:35; border-radius:3px;}
@keyframes fall{to{transform:translateY(1200px) rotate(720deg); opacity:0;}}
#safe{position:absolute; inset:54px 96px; border:3px dashed rgba(255,0,80,.5); border-radius:14px; z-index:45; display:none;}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,200,61,0))}50%{filter:drop-shadow(0 0 26px var(--glow))}}
.pop{animation:pop .4s ease-out both;}
.hop{animation:hop 1.1s ease-in-out infinite;}
.pulse{animation:pulse .9s ease-in-out infinite;}
.glow{animation:glow 1s ease-in-out infinite;}
#ui{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:10px; align-items:center;
  background:rgba(20,24,34,.9); padding:10px 14px; border-radius:16px; z-index:100; color:#fff; font-size:15px; font-family:system-ui,sans-serif;}
#ui button{background:#2F6BFF; color:#fff; border:0; padding:9px 14px; border-radius:10px; font-weight:700; cursor:pointer; font-size:15px;}
#ui button.alt{background:#39415a;}
#ui button:hover{filter:brightness(1.08);}
#bar{width:300px; height:10px; background:#39415a; border-radius:6px; overflow:hidden; cursor:pointer;}
#barFill{height:100%; width:0; background:#43C06A;}
#tlabel{min-width:96px; text-align:center; font-variant-numeric:tabular-nums;}
#scenes{display:flex; gap:5px;}
#scenes button{padding:7px 9px; font-size:12px; background:#39415a;}
#scenes button.on{background:#43C06A;}
.hintTop{position:fixed; top:10px; left:50%; transform:translateX(-50%); color:#9fb0c9; font-family:system-ui; font-size:13px; z-index:100;}
.badge{position:fixed; top:8px; left:12px; color:#9fb0c9; font-family:system-ui; font-size:13px; z-index:100; background:rgba(20,24,34,.7); padding:4px 10px; border-radius:8px;}
</style>
</head>
<body>
<div id="app"><div id="stageWrap"><div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="scene"></div>
  <div id="titleWrap"></div>
  <div id="caption"></div>
  <div id="safe"></div>
  <div id="wipe"></div>
</div></div></div>

<div class="badge" id="badge">Variant A · Storybook</div>
<div class="hintTop">1920×1080 · press Play · narration-synced · press H to hide UI for recording</div>

<div id="ui">
  <button id="play">▶ Play</button>
  <button id="restart" class="alt">⏮</button>
  <div id="bar"><div id="barFill"></div></div>
  <div id="tlabel">0:00 / 1:52</div>
  <div id="scenes"></div>
  <button id="mute" class="alt">🔊</button>
  <button id="cc" class="alt">CC</button>
  <button id="safeBtn" class="alt">Safe</button>
</div>

<script>
/* ======================= THEME ======================= */
const THEME = {
  world:'storybook', title:'Place Value Pals', subtitle:'Tens Town & Ones Town',
  badge:'Variant A · Storybook', oneExtra:'', tenExtra:'',
  wave:{ blip:'sine', ten:'triangle', ding:'sine' }
};

/* ======================= MASTER SYNC (measured from the actual narration audio) =======================
   Each entry: id, t=start ms, e=end ms, text=EXACT spoken words (also the subtitle). */
const SYNC_LIST = [
 {id:'w1',t:300,e:2714,text:'Welcome to the world of numbers!'},
 {id:'i1',t:2924,e:6203,text:'This is Ollie. Ollie is a one.'},
 {id:'i2',t:6383,e:9347,text:'Today we will learn about tens and ones.'},
 {id:'i3',t:9497,e:10876,text:"Let's go!"},
 {id:'o1',t:11206,e:13930,text:'These little blocks are called ones.'},
 {id:'o2',t:14110,e:15865,text:"Let's count them."},
 {id:'c1',t:16075,e:17379,text:'One.'},
 {id:'c2',t:17559,e:18699,text:'Two.'},
 {id:'c3',t:18879,e:20153,text:'Three.'},
 {id:'c4',t:20333,e:21702,text:'Four.'},
 {id:'o3',t:21942,e:23997,text:'Four ones make four.'},
 {id:'t0',t:24417,e:26611,text:'Now, watch this!'},
 {id:'t1',t:26821,e:28770,text:'Here are ten ones.'},
 {id:'n1',t:28980,e:30284,text:'One.'},
 {id:'n2',t:30386,e:31526,text:'Two.'},
 {id:'n3',t:31628,e:32902,text:'Three.'},
 {id:'n4',t:33004,e:34374,text:'Four.'},
 {id:'n5',t:34476,e:35870,text:'Five.'},
 {id:'n6',t:35972,e:37446,text:'Six.'},
 {id:'n7',t:37548,e:39023,text:'Seven.'},
 {id:'n8',t:39125,e:40294,text:'Eight.'},
 {id:'n9',t:40396,e:41696,text:'Nine.'},
 {id:'n10',t:41798,e:43097,text:'Ten.'},
 {id:'tm',t:43367,e:45591,text:'Ten ones make one ten!'},
 {id:'te',t:45921,e:48260,text:'Ten ones equals one ten.'},
 {id:'tn',t:48531,e:51855,text:'This is Tenny. Tenny is a ten.'},
 {id:'b0',t:52185,e:54024,text:"Let's build a number."},
 {id:'b1',t:54234,e:56213,text:'Here are three tens.'},
 {id:'b2',t:56423,e:58552,text:'And here are four ones.'},
 {id:'b3',t:58762,e:61881,text:'Three tens and four ones make thirty-four.'},
 {id:'p1',t:62361,e:66005,text:'In thirty-four, the three is in the tens place.'},
 {id:'p2',t:66215,e:68704,text:'And the four is in the ones place.'},
 {id:'p3',t:68914,e:70913,text:'Three tens is thirty.'},
 {id:'p4',t:71123,e:73227,text:'And four ones is four.'},
 {id:'p5',t:73438,e:76316,text:'Thirty plus four equals thirty-four.'},
 {id:'a0',t:76736,e:78851,text:"Let's try another number."},
 {id:'a1',t:79061,e:81115,text:'Here are five tens.'},
 {id:'a2',t:81325,e:83029,text:'And two ones.'},
 {id:'a3',t:83239,e:85268,text:'That makes fifty-two.'},
 {id:'q1',t:85688,e:90517,text:'Which number is greater? Thirty-four, or fifty-two?'},
 {id:'q2',t:93017,e:95131,text:'Look at the tens first.'},
 {id:'q3',t:95341,e:98150,text:'Five tens is more than three tens.'},
 {id:'q4',t:98360,e:101510,text:'So fifty-two is greater than thirty-four.'},
 {id:'r1',t:101930,e:105238,text:'A two-digit number is made of tens and ones.'},
 {id:'r2',t:105448,e:108567,text:'Three tens and four ones make thirty-four.'},
 {id:'r3',t:108837,e:112337,text:'Great job! See you next time!'}
];
const S={}; SYNC_LIST.forEach(x=>S[x.id]=x);
const LT=id=>S[id].t;              // start time of a line
const LE=id=>S[id].e;              // end time of a line
const TOTAL=112800;               // audio total (~1:52)
/* captions: exact narration, visible start→end (small 120ms tail, never into next line) */
const CAPS=SYNC_LIST.map((x,i)=>({a:x.t, b:Math.min(x.e+120, SYNC_LIST[i+1]?SYNC_LIST[i+1].t-1:x.e+150), text:x.text}));

/* ======================= engine ======================= */
const stage=document.getElementById('stage'), sceneEl=document.getElementById('scene'),
      bgEl=document.getElementById('bg'), titleWrap=document.getElementById('titleWrap'),
      captionEl=document.getElementById('caption'), wipeEl=document.getElementById('wipe');
document.getElementById('badge').textContent=THEME.badge;
document.title='Place Value Pals — '+THEME.badge;

const RENDER = /[?&]render=1/.test(location.search); // offline MP4 capture mode
function fit(){ const s=RENDER? Math.min(window.innerWidth/1920,window.innerHeight/1080) : Math.min(window.innerWidth/1920,(window.innerHeight-70)/1080);
  stage.style.transform='scale('+s+')';
  document.getElementById('stageWrap').style.width=(1920*s)+'px';
  document.getElementById('stageWrap').style.height=(1080*s)+'px'; }
window.addEventListener('resize',fit); fit();
addEventListener('keydown',e=>{ if(e.key==='h'||e.key==='H'){ ['ui','badge'].forEach(id=>{const el=document.getElementById(id); if(el)el.style.display=(el.style.display==='none'?'':'none');}); document.querySelectorAll('.hintTop').forEach(el=>el.style.display=(el.style.display==='none'?'':'none')); } });

function E(t,c,s){const e=document.createElement(t); if(c)e.className=c; if(s)Object.assign(e.style,s); return e;}
function add(p,t,c,s){const e=E(t,c,s); p.appendChild(e); return e;}
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function unitCube(x,y,size){ return E('div','unit',{left:x+'px',top:y+'px',width:size+'px',height:size+'px'}); }
function tenRod(x,y,w,segH){ const r=E('div','rod',{left:x+'px',top:y+'px',width:w+'px',height:(segH*10)+'px'});
  for(let i=1;i<10;i++){ r.appendChild(E('div','seg',{top:(i*segH)+'px'})); } return r; }

function ollie(scale=1){ const w=120*scale,h=120*scale,f=V('--one'),st=V('--char-stroke');
  const wrap=E('div','obj',{width:w+'px',height:h+'px'});
  wrap.innerHTML=`<svg viewBox="0 0 120 120" width="${w}" height="${h}">
    <rect x="12" y="12" width="96" height="96" rx="26" fill="${f}" stroke="${st}" stroke-width="6"/>
    <rect x="22" y="22" width="40" height="22" rx="11" fill="#fff" opacity=".5"/>
    <circle cx="46" cy="58" r="12" fill="#fff" stroke="${st}" stroke-width="4"/><circle cx="74" cy="58" r="12" fill="#fff" stroke="${st}" stroke-width="4"/>
    <circle cx="48" cy="60" r="5" fill="${st}"/><circle cx="76" cy="60" r="5" fill="${st}"/>
    <circle cx="36" cy="76" r="6" fill="#FF5E7A" opacity=".55"/><circle cx="86" cy="76" r="6" fill="#FF5E7A" opacity=".55"/>
    <path d="M46 82 Q60 96 74 82" stroke="${st}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="98" cy="30" r="16" fill="#fff" stroke="${st}" stroke-width="4"/>
    <text x="98" y="37" font-size="20" font-weight="800" text-anchor="middle" fill="${st}" font-family="Baloo 2,sans-serif">1</text>
    ${THEME.oneExtra}</svg>`;
  return wrap; }
function tenny(scale=1){ const w=120*scale,h=300*scale,f=V('--ten'),st=V('--char-stroke'),sd=V('--ten-d');
  let segs=''; for(let i=1;i<10;i++){segs+=`<line x1="14" y1="${12+i*27.6}" x2="106" y2="${12+i*27.6}" stroke="${sd}" stroke-width="3" opacity=".6"/>`;}
  const wrap=E('div','obj',{width:w+'px',height:h+'px'});
  wrap.innerHTML=`<svg viewBox="0 0 120 300" width="${w}" height="${h}">
    <rect x="12" y="12" width="96" height="276" rx="26" fill="${f}" stroke="${st}" stroke-width="6"/>
    <rect x="22" y="22" width="34" height="200" rx="16" fill="#fff" opacity=".22"/>${segs}
    <circle cx="46" cy="60" r="12" fill="#fff" stroke="${st}" stroke-width="4"/><circle cx="74" cy="60" r="12" fill="#fff" stroke="${st}" stroke-width="4"/>
    <circle cx="48" cy="62" r="5" fill="${st}"/><circle cx="76" cy="62" r="5" fill="${st}"/>
    <circle cx="34" cy="78" r="6" fill="#FF5E7A" opacity=".5"/><circle cx="86" cy="78" r="6" fill="#FF5E7A" opacity=".5"/>
    <path d="M46 84 Q60 98 74 84" stroke="${st}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="98" cy="30" r="17" fill="#fff" stroke="${st}" stroke-width="4"/>
    <text x="98" y="37" font-size="17" font-weight="800" text-anchor="middle" fill="${st}" font-family="Baloo 2,sans-serif">10</text>
    ${THEME.tenExtra}</svg>`;
  return wrap; }

function buildBG(){ bgEl.innerHTML=''; const w=THEME.world;
  if(w==='storybook'){
    add(bgEl,'div',null,{position:'absolute',top:'70px',right:'140px',width:'150px',height:'150px',borderRadius:'50%',background:'radial-gradient(circle at 40% 40%,#FFE680,#FFC83D)',boxShadow:'0 0 70px rgba(255,200,61,.6)'});
    [[180,120,170,60],[520,80,120,46],[1360,150,150,56],[900,70,110,44]].forEach(c=>add(bgEl,'div','cloud',{left:c[0]+'px',top:c[1]+'px',width:c[2]+'px',height:c[3]+'px'}));
    add(bgEl,'div','hill',{bottom:'0',height:'260px',background:'#6Fc66a'}); add(bgEl,'div','hill',{bottom:'0',height:'180px',background:'#8FD98A'});
  } else if(w==='playroom'){
    add(bgEl,'div',null,{position:'absolute',left:0,right:0,bottom:0,height:'300px',background:'linear-gradient(#E8C9A0,#D8B488)'});
    add(bgEl,'div',null,{position:'absolute',left:'120px',bottom:'300px',width:'1680px',height:'22px',background:'#B98A5B'});
    add(bgEl,'div',null,{position:'absolute',left:'60px',top:'120px',width:'360px',height:'300px',background:'#C98A4A',borderRadius:'14px',opacity:.5});
    add(bgEl,'div',null,{position:'absolute',left:'80px',top:'150px',width:'90px',height:'90px',background:'#E5564B',borderRadius:'10px',opacity:.6});
    add(bgEl,'div',null,{position:'absolute',left:'190px',top:'150px',width:'90px',height:'90px',background:'#3FA7D6',borderRadius:'10px',opacity:.6});
    add(bgEl,'div',null,{position:'absolute',left:'300px',top:'150px',width:'90px',height:'90px',background:'#F6C244',borderRadius:'10px',opacity:.6});
    add(bgEl,'div',null,{position:'absolute',left:'50%',bottom:'40px',width:'900px',height:'120px',transform:'translateX(-50%)',background:'radial-gradient(ellipse,#F2A2A2,transparent 70%)',opacity:.6});
  } else if(w==='space'){
    stage.style.setProperty('--stage-bg','radial-gradient(circle at 70% 30%,#13204a,#070b1c)');
    for(let i=0;i<90;i++){ const s=1+Math.random()*3; add(bgEl,'div','star',{left:(Math.random()*1920)+'px',top:(Math.random()*1080)+'px',width:s+'px',height:s+'px',opacity:(0.4+Math.random()*0.6)}); }
    add(bgEl,'div',null,{position:'absolute',right:'120px',top:'120px',width:'220px',height:'220px',borderRadius:'50%',background:'radial-gradient(circle at 35% 35%,#8be0ff,#2a6bd6 70%,#143a86)',boxShadow:'0 0 60px rgba(90,180,255,.4)'});
    add(bgEl,'div',null,{position:'absolute',left:'120px',bottom:'120px',width:'90px',height:'90px',borderRadius:'50%',background:'radial-gradient(circle at 40% 40%,#fff,#c9d4e8)',opacity:.85});
  } else if(w==='chalkboard'){
    stage.style.setProperty('--stage-bg','linear-gradient(#214a37,#1a3c2d)');
    add(bgEl,'div',null,{position:'absolute',inset:'0',border:'26px solid #7a4e24',borderRadius:'18px',boxShadow:'inset 0 0 60px rgba(0,0,0,.4)'});
    add(bgEl,'div',null,{position:'absolute',left:'120px',top:'90px',color:'rgba(255,255,255,.18)',fontFamily:'Patrick Hand',fontSize:'60px'}).textContent='1  2  3 ...';
    add(bgEl,'div',null,{position:'absolute',right:'140px',bottom:'90px',color:'rgba(255,255,255,.14)',fontFamily:'Patrick Hand',fontSize:'52px'}).textContent='+  =  >';
  }
}

/* ---------- AUDIO SFX ---------- */
let AC=null, muted=false;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(freq,dur,type='sine',vol=.3,slideTo=null,delay=0){ if(muted)return; const a=ac(),t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02); }
function noise(dur,vol=.3,hp=600,delay=0){ if(muted)return; const a=ac(),t=a.currentTime+delay;
  const n=a.createBufferSource(),buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; n.buffer=buf;
  const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f).connect(g).connect(a.destination); n.start(t); n.stop(t+dur); }
const W=THEME.wave||{};
const SFX={ pop(){tone(420,.14,W.blip||'sine',.32,760);}, tick(){tone(900,.05,'square',.12);},
  clack(){tone(200,.12,'square',.26,120); noise(.06,.1,1200);}, whoosh(){noise(.4,.22,500);},
  ding(){tone(880,.5,W.ding||'sine',.28); tone(1320,.5,'sine',.15,null,.02);},
  transform(){[330,440,550,660,780].forEach((f,i)=>tone(f,.18,W.ten||'triangle',.24,null,i*.08)); tone(150,.25,'square',.28,80,.42); noise(.12,.16,800,.42);},

  add(root,'div',null,{position:'absolute',left:'1120px',top:'300px',width:'520px',height:'560px',border:'5px dashed rgba(255,138,61,.45)',borderRadius:'24px'});
  const header=add(root,'div','bigtext',{left:'960px',top:'60px',fontSize:'70px'}); header.innerHTML='';
  const counter=add(root,'div','counter',{left:'960px',top:'880px',transform:'translateX(-50%)',fontSize:'110px',opacity:0}); counter.textContent='0';
  const big=add(root,'div','bigtext',{left:'960px',top:'430px',fontSize:'200px',color:'var(--good)',opacity:0}); big.textContent=(tens*10+ones);
  big.style.transform='translateX(-50%) scale(.3)'; big.style.transition='all .5s cubic-bezier(.2,1.5,.4,1)';
  const rodW=72,seg=46,rodH=seg*10,rodBottom=840,rodGap=30; const rodStartX=560-((tens*rodW+(tens-1)*rodGap)/2);
  const uSize=104,uGap=20,onesStartX=1210,onesTopBase=760; const cues=[];
  o.rodTs.forEach((t,i)=>cues.push({t,fn:()=>{ const r=tenRod(rodStartX+i*(rodW+rodGap),rodBottom-rodH,rodW,seg);
    r.style.transformOrigin='bottom'; r.style.transform='translateY(-40px) scale(1.05)'; r.style.transition='transform .35s ease'; root.appendChild(r);
    requestAnimationFrame(()=>r.style.transform='translateY(0) scale(1)'); counter.style.opacity=1; counter.textContent=(i+1)*10; SFX.clack(); }}));
  o.cubeTs.forEach((t,i)=>cues.push({t,fn:()=>{ const col=i%2,row=Math.floor(i/2);
    const c=unitCube(onesStartX+col*(uSize+uGap),onesTopBase-row*(uSize+uGap),uSize); c.classList.add('pop'); root.appendChild(c);
    counter.textContent=tens*10+(i+1); SFX.pop(); }}));
  o.header.forEach(h=>cues.push({t:h.t,fn:()=>{ header.innerHTML=h.html; }}));
  let tCheer,oCheer;
  if(o.cheer){ tCheer=tenny(.85); tCheer.style.left='150px'; tCheer.style.top='560px'; tCheer.style.opacity=0; tCheer.style.transition='opacity .3s'; root.appendChild(tCheer);
               oCheer=ollie(.95); oCheer.style.left='1655px'; oCheer.style.top='760px'; oCheer.style.opacity=0; oCheer.style.transition='opacity .3s'; root.appendChild(oCheer); }
  cues.push({t:o.bigT,fn:()=>{ big.style.opacity=1; big.style.transform='translateX(-50%) scale(1)'; counter.style.opacity=0;
    if(o.cheer){ SFX.ding(); SFX.celebrate(); [tCheer,oCheer].forEach(el=>{ el.style.opacity=1; el.classList.add('hop'); }); starBurst(960,480,9); }
    else { SFX.ding(); } }});
  return { cues };
}
function makeChart(root){ const ch=add(root,'div','chart',{left:'510px',top:'250px',width:'900px',height:'560px'});
  add(ch,'div','divider',{left:'447px'});
  const t=add(ch,'div','col-h',{left:'0',width:'450px',background:'var(--ten)'}); t.textContent='TENS';
  const o=add(ch,'div','col-h',{left:'450px',width:'450px',background:'var(--one)'}); o.textContent='ONES'; return ch; }
function towerGroup(root,tens,ones,centerX,numText){ const rodW=58,seg=34,rodH=seg*10,bottom=760,gap=16;
  const tensW=tens*rodW+(tens-1)*gap,tensObjs=[],startX=centerX-tensW/2;
  for(let i=0;i<tens;i++){ const r=tenRod(startX+i*(rodW+gap),bottom-rodH,rodW,seg); r.classList.add('pop'); root.appendChild(r); tensObjs.push(r); }
  const uSize=58,ugap=10,oStart=centerX-((Math.min(ones,2)*uSize+(Math.min(ones,2)-1)*ugap)/2);
  for(let i=0;i<ones;i++){ const col=i%2,row=Math.floor(i/2); const c=unitCube(oStart+col*(uSize+ugap),bottom+28+row*(uSize+ugap),uSize); c.classList.add('pop'); root.appendChild(c); }
  const lbl=add(root,'div','bigtext',{left:centerX+'px',top:'250px',fontSize:'120px',color:(numText==='34'?'var(--ten)':'var(--one)')}); lbl.textContent=numText;
  return { highlightTens:()=>{ tensObjs.forEach(r=>{ r.style.boxShadow='0 0 0 6px var(--good), inset 0 6px 10px rgba(255,255,255,.4)'; }); } };
}
